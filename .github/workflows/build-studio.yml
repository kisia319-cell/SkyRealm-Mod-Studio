name: Build SkyRealm Mod Studio
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/build-studio.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build standalone executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name SkyRealmModStudio main.py
      - uses: actions/upload-artifact@v4
        with:
          name: SkyRealmModStudio-EXE
          path: dist/SkyRealmModStudio.exe
          if-no-files-found: error
          retention-days: 30

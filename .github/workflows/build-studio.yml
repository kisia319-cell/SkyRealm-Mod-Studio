name: Build SkyRealm Mod Studio

concurrency:
  group: skyrealm-mod-studio-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Версия релиза, например 1.3.0. Оставь пустым для обычной сборки."
        required: false
        type: string
        default: ""
  push:
    branches: [ main ]
    tags: [ "v*" ]
    paths:
      - "main.py"
      - "studio_features.py"
      - "advanced_tools.py"
      - "updater.py"
      - "core/**"
      - "tests/**"
      - "editors/**"
      - "requirements.txt"
      - ".github/workflows/build-studio.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Compile Python sources
        run: python -m compileall -q main.py core editors updater.py advanced_tools.py tests
      - name: Run Studio regression tests
        env:
          QT_QPA_PLATFORM: offscreen
          SKYREALM_STUDIO_TEST: "1"
        run: |
          python tests/test_studio_core.py
          python tests/test_project_validation.py
          python tests/test_smart_analysis.py
          python tests/test_compatibility.py
          python tests/test_visual_designer.py
          python tests/test_debugger_tools.py
          python tests/test_mod_manager.py
          python tests/test_archive_builder.py
          python tests/test_sprite_editor.py
      - name: Build standalone executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name SkyRealmModStudio main.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyRealmModStudio-EXE
          path: dist/SkyRealmModStudio.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish or update stable release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.2
          target_commitish: main
          files: dist/SkyRealmModStudio.exe
          overwrite_files: true
          make_latest: true
          generate_release_notes: true
      - name: Publish manually requested release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.release_version) }}
          target_commitish: main
          files: dist/SkyRealmModStudio.exe
          overwrite_files: true
          generate_release_notes: true
